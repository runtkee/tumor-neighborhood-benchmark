dataset: IMMUcan_IMC_panel1_csv
modality: protein
path: data/immucan/immucan_panel1_cells.csv
columns: {patient: SampleId, field: image, x: Pos_X, y: Pos_Y, type: celltypes}
pixel_size_um: 1.0   # IMMUcan methods (Eling et al., bioRxiv 10.1101/2024.12.16.628597): "acquired at 400 Hz with 1 µm resolution", ROIs "600x600 µm" = the 600x600 px images; cell spacing 8.2 µm
roles:
  Tumor: tumor
  Mural: stroma
  CD8: 'T:CD8'
  CD4: 'T:CD4'
  Treg: 'T:Treg'
  MacCD163: mac
  Neutrophil: neut      # CD15+ MPO+
  plasma: B
  B: B
  BnT: other            # mixed B/T label
  HLADR: other
  DC: other
  NK: other
  pDC: other
  undefined: drop
states: {prolif: Ki67, PD1: PD1, GZMB: GrzB, LAG3: LAG3, ICOS: ICOS, apoptosis: cleavedPARP}
bleed: {neut: MPO, mac: CD68, stroma: SMA}
mac_states: {PDL1: PDL1, IDO1: Ido1, CD163: CD163, HLADR: HLADR, M2: CD206}   # names checked against the panel header (recipe v3p macrophage-state tests); IDO1 is spelled Ido1
