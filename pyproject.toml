[project]
name = "tumor-neighborhood-benchmark"
version = "0.1.0"
description = "Compare tumor-imaging cell tables with public data on T-cell, neutrophil and macrophage neighborhood tests, locally."
authors = [{ name = "runtkee" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.13.4",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "rdata>=1.1.0",
    "scanpy>=1.12.4",
    "scipy>=1.18.1",
    "squidpy>=1.8.3",
    "statsmodels>=0.15.0",
]

[tool.uv.build-backend]
module-name = "bio"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
