dataset: SPATCH_COAD_cosmx6k
modality: rna
path: data/spatch/cosmx6k_coad/transcriptome/adata.h5ad
filters: {high_quality: 1}
columns: {patient: SPATCH_COAD_cosmx6k, field: SPATCH_COAD_cosmx6k, x: "obsm:spatial:0", y: "obsm:spatial:1", type: annotation}   # one patient, one section
pixel_size_um: 1.0   # coordinates already in µm: tissue spans 7–14 mm and cells sit 7–10 µm apart; image pixel sizes are stored separately (uns DAPI resolution: Xenium 0.2125, CosMx 0.1203 µm)
identity_genes: [CD3D, CD3E, CD3G, CD2, CD247]
roles: {CD4T: 'T:CD4', CD8T: 'T:CD8', Tprolif: T, Neutrophil: other,  # reviewed: neutrophil markers ~background on this panel (check failed), so neutrophil tests are excluded
        Macrophage: mac, Kupffer: mac, B: B, Plasma: B,
        Fibroblast: stroma, SMC: stroma, Epithelial: tumor, Hepatocyte: tumor,
        Endothelial: other, Monocyte: other, mregDC: other, cDC1: other, cDC2: other, pDC: other, DC: other, Mast: other, NK: other}
states: {prolif: [MKI67, TOP2A, CDK1, PCNA, MCM2, TYMS], PD1: [PDCD1], GZMB: [GZMB], LAG3: [LAG3], ICOS: [ICOS]}
bleed:
  neut: [CSF3R, CXCR1, CXCR2, FCGR3B, FPR1]
  mac: [CD68, CD163, C1QA, C1QB, C1QC, MRC1, APOE]
  stroma: [COL1A1, COL1A2, COL3A1, DCN, LUM, PDGFRA, PDGFRB]
mac_identity_genes: [CD68, CD14, CSF1R, C1QA, C1QB, C1QC]   # macrophage states are expressed relative to these (recipe v3p)
mac_states: {PDL1: [CD274], IDO1: [IDO1], M2: [CD163, MRC1, MSR1]}
